<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Splatter Physics</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background-color: #050505; }
        
        /* Layer 1: tsParticles (The Neon Smoke) */
        #tsparticles { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; pointer-events: none; }
        
        /* Layer 2: Matter.js (The Clickable Physics) */
        #physics-canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 2; }
    </style>
</head>
<body>
    <div id="tsparticles"></div>
    <canvas id="physics-canvas"></canvas>

    <!-- Import Engines -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tsparticles@2/tsparticles.bundle.min.js"></script>

    <!-- Import Custom Logic -->
    <script src="particles.js"></script>
    <script src="physics.js"></script>
</body>
</html>
